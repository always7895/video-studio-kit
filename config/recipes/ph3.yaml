schema_version: 1
id: ph3
kind: still
description: "P-H3 INT8 still, 8MP resolution selector"
workflow:
  path: workflows/api/ph3_still.api.json
  sha256: a66ca7d93faae5ebf9165729db65a7371ea9600cd47a0a216b71f4cd5aef33b3
parameters:
  model: {node: '22', input: unet_name}
  text_encoder: {node: '24', input: clip_name}
  prompt_upsampler_model: {node: '13', input: clip_name}
  vae: {node: '25', input: vae_name}
  steps: {node: '6', input: sigmas, encoding: sigma_schedule}
  sampler: {node: '8', input: sampler_name}
  aspect_ratio: {node: '20', input: aspect_ratio}
  megapixels: {node: '20', input: megapixels}
  resolution_multiple: {node: '20', input: multiple}
  prompt_upsampler_enabled: {node: '19', input: switch}
  seed: {node: '9', input: noise_seed}
  prompt: {node: '16', input: value}
  filename_prefix: {node: '12', input: filename_prefix}
defaults:
